services:
  - type: web
    name: phishing-detection
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 2 --timeout 120 app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: APP_SECRET_KEY
        generateValue: true
